# Why this fork exists:
# Node.js released security fixes on 2026-10-21 (10 CVEs, including
# CVE-2026-111497, a Brotli decoder out-of-bounds write that can lead to RCE).
# Upstream towfiqi/serpbear has not published an image since v3.1.0 (2026-03-27,
# built on Node 22.22.2). This branch is the v3.1.0 tag with the Dockerfile's
# node:22-alpine base pinned to node:22.23.4-alpine by digest. Nothing else in
# the app is changed. This workflow builds and publishes that image to GHCR.
name: Publish patched image

on:
  push:
    branches:
      - patched/v3.1.0-node22.23.4
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/queso/serpbear
  TAG: v3.1.0-node22.23.4
  EXPECTED_NODE: v22.23.4

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Verify Node version
        run: |
          actual="$(docker run --rm --entrypoint node "${IMAGE}:${TAG}-${{ steps.sha.outputs.short }}" --version)"
          echo "node --version: ${actual}"
          if [ "${actual}" != "${EXPECTED_NODE}" ]; then
            echo "::error::Expected ${EXPECTED_NODE}, got ${actual}"
            exit 1
          fi

      - name: Summary
        run: echo "Pushed ${IMAGE}:${TAG} (${{ steps.build.outputs.digest }})" >> "$GITHUB_STEP_SUMMARY"
